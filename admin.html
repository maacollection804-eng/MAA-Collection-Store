<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MAA COLLECTION Admin</title><style>
body{margin:0;background:#faf7f2;color:#302923;font:14px Arial}.wrap{max-width:900px;margin:auto;padding:24px 15px}.card{background:white;padding:22px;margin:15px 0;border:1px solid #e9dfd5;border-radius:10px}.brand{font:24px Georgia;letter-spacing:2px}h1,h2{font:500 28px Georgia}label{display:block;color:#82766d;font-size:12px;margin:12px 0 6px}input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #e9dfd5;border-radius:5px}button{border:0;background:#302923;color:white;padding:12px 16px;border-radius:4px;margin:12px 5px 0 0}button.alt{background:#e9dfd5;color:#302923}button.del{background:#965e59}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none!important}.msg{color:#965e59}.muted{color:#82766d;font-size:12px;line-height:1.6}.item{display:flex;gap:12px;align-items:center;border-top:1px solid #eee;padding:12px 0}.item img{width:65px;height:80px;object-fit:cover}.item div{flex:1}.sizes{display:flex;gap:12px;flex-wrap:wrap}.sizes label{display:flex;align-items:center;gap:4px}.sizes input{width:auto}@media(max-width:550px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="brand">MAA COLLECTION</div><p class="muted">STORE MANAGEMENT</p>
<section class="card" id="login"><h1>Admin login</h1><form id="lf"><label>Username</label><input id="u" autocomplete="username" required><label>Password</label><input id="p" type="password" autocomplete="current-password" required><button>Sign in</button></form><p id="lm" class="msg"></p></section>
<section id="panel" class="hidden"><div class="card"><h1>Manage products</h1><p class="muted">Upload a product photo directly from your phone (JPG, PNG or WebP, max 5 MB).</p><form id="pf"><input id="id" type="hidden"><div class="grid"><div><label>Product name</label><input id="name" required maxlength="100"></div><div><label>Category</label><select id="cat"><option>Casual</option><option>Fancy</option></select></div><div><label>Price (PKR)</label><input id="price" type="number" min="0" required></div><div><label>Tag</label><input id="tag" value="New Arrival"></div></div><label>Choose photo</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><label>Or image URL (HTTPS)</label><input id="url" type="url" placeholder="https://..."><label>Sizes</label><div class="sizes"><label><input type="checkbox" value="S" checked> S</label><label><input type="checkbox" value="M" checked> M</label><label><input type="checkbox" value="L" checked> L</label><label><input type="checkbox" value="XL" checked> XL</label></div><button id="save">Save product</button><button type="button" class="alt" id="clear">Clear</button><button type="button" class="alt" id="logout">Log out</button><p id="fm" class="msg"></p></form></div><div class="card"><h2>Products</h2><div id="list">Loading…</div></div></section></main>
<script>
const $=x=>document.getElementById(x);async function api(url,opt={}){let r=await fetch(url,{...opt,credentials:"same-origin"}),d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||"Request failed");return d}
function show(ok){$("login").classList.toggle("hidden",ok);$("panel").classList.toggle("hidden",!ok)}
async function check(){try{let d=await api("/api/me");show(d.authenticated);if(d.authenticated)load()}catch{show(false)}}$("lf").onsubmit=async e=>{e.preventDefault();$("lm").textContent="Signing in…";try{await api("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("u").value,password:$("p").value})});$("p").value="";$("lm").textContent="";show(true);load()}catch(x){$("lm").textContent=x.message}};
$("logout").onclick=async()=>{try{await api("/api/logout",{method:"POST"})}finally{show(false)}};
let items=[];function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function load(){try{items=(await api("/api/products")).products;$("list").innerHTML=items.length?items.map(p=>`<div class="item"><img src="${esc(p.image_url)}"><div><b>${esc(p.name)}</b><br><small>${esc(p.category)} · Rs. ${p.price} · ${(p.sizes||[]).join(", ")}</small></div><button class="alt" data-edit="${esc(p.id)}">Edit</button><button class="del" data-del="${esc(p.id)}">Delete</button></div>`).join(""):"No products yet"}catch(e){$("list").textContent=e.message}}
$("list").onclick=async e=>{let id=e.target.dataset.edit,del=e.target.dataset.del;if(id){let p=items.find(x=>x.id===id);$("id").value=p.id;$("name").value=p.name;$("cat").value=p.category;$("price").value=p.price;$("tag").value=p.tag;$("url").value=p.image_url;document.querySelectorAll(".sizes input").forEach(x=>x.checked=(p.sizes||[]).includes(x.value));$("save").textContent="Update product";scrollTo(0,0)}if(del&&confirm("Delete this product?")){try{await api("/api/products?id="+encodeURIComponent(del),{method:"DELETE"});load()}catch(x){alert(x.message)}}};
$("clear").onclick=()=>{$("pf").reset();$("id").value="";$("tag").value="New Arrival";$("save").textContent="Save product";$("fm").textContent=""};
$("pf").onsubmit=async e=>{e.preventDefault();$("fm").textContent="Saving…";try{let url=$("url").value.trim(),f=$("photo").files[0];if(f){let fd=new FormData();fd.append("image",f);url=(await api("/api/upload",{method:"POST",body:fd})).url}if(!url.startsWith("https://"))throw Error("Upload a photo or enter a public HTTPS image URL");let p={id:$("id").value,name:$("name").value,category:$("cat").value,price:Number($("price").value),tag:$("tag").value,image_url:url,sizes:[...document.querySelectorAll(".sizes input:checked")].map(x=>x.value)};if(!p.sizes.length)throw Error("Choose at least one size");await api("/api/products",{method:p.id?"PATCH":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});$("fm").textContent="Saved";$("clear").click();load()}catch(x){$("fm").textContent=x.message}};check();
</script></body></html>
